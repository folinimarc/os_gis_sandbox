name:
  ${OSGS_NAMESPACE}

volumes:
  # Persists all geoserver related data and configuration.
  geoserver_data:
  # Persists database content.
  postgis_data:
  # Persists database connections and settings.
  pgadmin_data:
  # Persists home directory with all notebook and user created content.
  jupyterlabgeoenv_data:
  # Persists Filebrowser database and settings.
  filebrowser_data:
  # Shared read/write volume across selected services.
  sandbox_shared:

services:

  postgis:
    container_name: ${OSGS_NAMESPACE}-postgis
    image: postgis/postgis:${OSGS_POSTGIS_VERSION}
    volumes:
      - postgis_data:/var/lib/postgresql # Note: Is /var/lib/postgresql/data for postgresql versions < 18
    ports:
      - "127.0.0.1:${OSGS_POSTGIS_PORT}:5432"
    environment:
      - "POSTGRES_DB=${OSGS_DB_NAME}"
      - "PGUSER=${OSGS_USERNAME}"
      - "POSTGRES_USER=${OSGS_USERNAME}"
      - "POSTGRES_PASSWORD=${OSGS_PASSWORD}"
    shm_size: 256MB

  geoserver:
    container_name: ${OSGS_NAMESPACE}-geoserver
    image: kartoza/geoserver:${OSGS_GEOSERVER_VERSION}
    volumes:
      - geoserver_data:/opt/geoserver/data_dir
      - sandbox_shared:/opt/geoserver/data_dir/${OSGS_SANDBOX_SHARED_MOUNT_FOLDER_NAME}
    ports:
      - "127.0.0.1:${OSGS_LOCALHOST_GEOSERVER_PORT}:8080"
    environment:
      - "GEOSERVER_DATA_DIR=/opt/geoserver/data_dir"
      - "GEOWEBCACHE_CACHE_DIR=/opt/geoserver/data_dir/gwc"
      - "GEOSERVER_ADMIN_USER=${OSGS_USERNAME}"
      - "GEOSERVER_ADMIN_PASSWORD=${OSGS_PASSWORD}"
      - "INITIAL_MEMORY=${OSGS_GEOSERVER_INITIAL_MEMORY}"
      - "MAXIMUM_MEMORY=${OSGS_GEOSERVER_MAXIMUM_MEMORY}"
      - "SAMPLE_DATA=${OSGS_GEOSERVER_SAMPLE_DATA}"
      - "STABLE_EXTENSIONS=${OSGS_GEOSERVER_STABLE_EXTENSIONS}"
      - "COMMUNITY_EXTENSIONS=${OSGS_GEOSERVER_COMMUNITY_EXTENSIONS}"
      - "TOMCAT_EXTRAS=false"
      - "ROOT_WEBAPP_REDIRECT=true"
      - "RECREATE_DATADIR=false"
    depends_on:
      shared_volume_permissions:
        condition: service_completed_successfully
      content:
        condition: service_completed_successfully

  pgadmin:
    container_name: ${OSGS_NAMESPACE}-pgadmin
    image: "dpage/pgadmin4:${OSGS_PGADMIN_VERSION}"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      # IMPORTANT: Keep pgAdmin's own storage root inside pgadmin_data.
      # Mounting sandbox_shared directly to /var/lib/pgadmin/storage can break
      # pgAdmin startup checks after fresh volume recreation.
      - sandbox_shared:/var/lib/pgadmin/storage/${OSGS_USERNAME}/${OSGS_SANDBOX_SHARED_MOUNT_FOLDER_NAME}
    ports:
      - "127.0.0.1:${OSGS_LOCALHOST_PGADMIN_PORT}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${OSGS_USERNAME}@dummymail.com
      PGADMIN_DEFAULT_PASSWORD: ${OSGS_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'True'
    depends_on:
      shared_volume_permissions:
        condition: service_completed_successfully

  jupyterlab:
    container_name: ${OSGS_NAMESPACE}-jupyterlab
    image: ghcr.io/folinimarc/os_gis_sandbox/jupyterlabgeoenv:${OSGS_JUPYTERLABGEOENV_VERSION}
    volumes:
      - jupyterlabgeoenv_data:/sandbox
      - sandbox_shared:/sandbox/${OSGS_SANDBOX_SHARED_MOUNT_FOLDER_NAME}
    ports:
      - "127.0.0.1:${OSGS_LOCALHOST_JUPYTERLAB_PORT}:8888"
    environment:
      - "JUPYTER_CONFIG_DIR=/sandbox/.jupyter"
      - "JUPYTER_DATA_DIR=/sandbox/.local/share/jupyter"
      - "JUPYTER_RUNTIME_DIR=/sandbox/.local/share/jupyter/runtime"
    command:
      [
        "jupyter",
        "lab",
        "--ip",
        "0.0.0.0",
        "--port",
        "8888",
        "--no-browser",
        "--autoreload",
        "--IdentityProvider.token=",
        "--ServerApp.base_url=/jupyterlab",
        "--ServerApp.root_dir=/sandbox",
        "--ServerApp.disable_check_xsrf=True"
      ]
    depends_on:
      shared_volume_permissions:
        condition: service_completed_successfully
      content:
        condition: service_completed_successfully

  # One-shot init service that prepares permissions on the shared volume.
  # It ensures all sandbox services can read/write shared files and that new
  # files inherit open permissions through default ACLs.
  shared_volume_permissions:
    container_name: ${OSGS_NAMESPACE}-shared-volume-permissions
    image: alpine:3.22
    volumes:
      - sandbox_shared:/sandbox_shared
      - pgadmin_data:/pgadmin_data
      - jupyterlabgeoenv_data:/jupyter_data
    environment:
      OSGS_USERNAME: ${OSGS_USERNAME}
    command:
      - sh
      - -ec
      - |
          apk add --no-cache acl
          # Keep pgAdmin storage writable after "docker compose down -v".
          # pgAdmin runs as uid 5050 (group root), so ensure group write access.
          mkdir -p /pgadmin_data/storage/${OSGS_USERNAME}
          chmod -R u+rwX,g+rwX /pgadmin_data/storage
          chown -R 5050:0 /pgadmin_data/storage
          # Keep Jupyter /sandbox writable without assuming a fixed runtime uid/gid.
          mkdir -p /jupyter_data/.jupyter /jupyter_data/.local/share/jupyter/runtime
          chmod -R a+rwX /jupyter_data
          # Normalize permissions on existing content.
          find /sandbox_shared -type d -exec chmod 0777 {} \;
          find /sandbox_shared -type f -exec chmod 0666 {} \;
          # Ensure future files/directories inherit permissive ACLs.
          setfacl -R -m u::rwx,g::rwx,o::rwx /sandbox_shared
          setfacl -R -d -m u::rwx,g::rwx,o::rwx /sandbox_shared

  content:
    container_name: ${OSGS_NAMESPACE}-content
    image: ghcr.io/folinimarc/os_gis_sandbox/content:${OSGS_CONTENT_VERSION}
    volumes:
      - sandbox_shared:/sandbox_shared
    entrypoint:
      - sh
      - -ec
      - |
          mkdir -p /sandbox_shared/${OSGS_CONTENT_MOUNT_FOLDER_NAME}
          cp -rT /content_img/. /sandbox_shared/${OSGS_CONTENT_MOUNT_FOLDER_NAME}/

  filebrowser:
    container_name: ${OSGS_NAMESPACE}-filebrowser
    image: filebrowser/filebrowser:${OSGS_FILEBROWSER_VERSION}
    entrypoint:
      - /bin/sh
      - -ec
    volumes:
      - sandbox_shared:/srv/${OSGS_SANDBOX_SHARED_MOUNT_FOLDER_NAME}
      - filebrowser_data:/database
    ports:
      - "127.0.0.1:${OSGS_LOCALHOST_FILEBROWSER_PORT}:80"
    environment:
      - "FB_BASEURL=/files"
      - "OSGS_USERNAME=${OSGS_USERNAME}"
      - "OSGS_PASSWORD=${OSGS_PASSWORD}"
    command:
      - |
          if [ ! -s "/database/filebrowser.db" ]; then
            filebrowser config init \
              --database /database/filebrowser.db \
              --root /srv \
              --baseURL /files \
              --auth.method noauth \
              --minimumPasswordLength 1 \
              --fileMode 0o666 \
              --dirMode 0o777 \
              --viewMode list \
              --tus.chunkSize 1048576
          fi

          if ! filebrowser users find "${OSGS_USERNAME}" --database /database/filebrowser.db >/dev/null 2>&1; then
            filebrowser users add "${OSGS_USERNAME}" "${OSGS_PASSWORD}" \
              --database /database/filebrowser.db \
              --perm.admin
          fi

          exec /init.sh \
            --port 80 \
            --address 0.0.0.0 \
            --root /srv \
            --database /database/filebrowser.db \
            --baseURL /files \
            --noauth
    depends_on:
      shared_volume_permissions:
        condition: service_completed_successfully

  hub:
    container_name: ${OSGS_NAMESPACE}-hub
    image: ghcr.io/folinimarc/os_gis_sandbox/hub:${OSGS_HUB_VERSION}
    ports:
      - "127.0.0.1:${OSGS_LOCALHOST_HUB_PORT}:5000"
    command:
      [
        "gunicorn",
        "--workers",
        "2",
        "--threads",
        "2",
        "--worker-class",
        "gthread",
        "--bind",
        "0.0.0.0:5000",
        "app:app",
      ]
    environment:
      - "CARD_1_TITLE=JupyterLab-GeoEnv"
      - "CARD_1_DESCRIPTION=A JupyterLab environment pre-configured to explore GDAL's capabilities and the Python geo-ecosystem. Shared sandbox folder is available through ${OSGS_SANDBOX_SHARED_MOUNT_FOLDER_NAME}. Data stories and provided content are located in ${OSGS_SANDBOX_SHARED_MOUNT_FOLDER_NAME}/${OSGS_CONTENT_MOUNT_FOLDER_NAME}."
      - "CARD_1_HREF=Open,http://localhost:${OSGS_LOCALHOST_JUPYTERLAB_PORT}/jupyterlab"
      - "CARD_2_TITLE=pgAdmin"
      - "CARD_2_DESCRIPTION=pgAdmin provides a graphical user interface to interact with PostgreSQL/PostGIS databases. Shared files are visible in the file picker under storage/${OSGS_USERNAME}/${OSGS_SANDBOX_SHARED_MOUNT_FOLDER_NAME}."
      - "CARD_2_HREF=Open,http://localhost:${OSGS_LOCALHOST_PGADMIN_PORT}/browser"
      - "CARD_2_CONNECTIONINFO=Username,${OSGS_USERNAME}@dummymail.com;Password,${OSGS_PASSWORD}"
      - "CARD_3_TITLE=PostGIS"
      - "CARD_3_DESCRIPTION=PostGIS is an extension for postgreSQL that turns it into a spatial database. To interact use pgAdmin or psql from the terminal of JupyterLab-GeoEnv. To connect from outside the sandbox use HostExternal and PortExternal."
      - "CARD_3_CONNECTIONINFO=Username,${OSGS_USERNAME};Password,${OSGS_PASSWORD};Database name,${OSGS_DB_NAME};Host,${OSGS_NAMESPACE}-postgis;Port,5432;HostExternal, localhost;PortExternal,${OSGS_POSTGIS_PORT}"
      - "CARD_4_TITLE=Geoserver"
      - "CARD_4_DESCRIPTION=Geoserver implements OGC web services like WMS and WFS, similar to alternatives like MapServer or QGISserver. A community extension is activated to provide functionalities of the new OGC API standard. Shared sandbox folder is available through ${OSGS_SANDBOX_SHARED_MOUNT_FOLDER_NAME} in GeoServer's data directory. To connect from outside the sandbox use HostExternal and PortExternal."
      - "CARD_4_HREF=Open,http://localhost:${OSGS_LOCALHOST_GEOSERVER_PORT}/geoserver/web/"
      - "CARD_4_CONNECTIONINFO=Username,${OSGS_USERNAME};Password,${OSGS_PASSWORD};Host,${OSGS_NAMESPACE}-geoserver;Port,8080;HostExternal,localhost;PortExternal,${OSGS_LOCALHOST_GEOSERVER_PORT}"
      - "CARD_5_TITLE=Openlayers"
      - "CARD_5_DESCRIPTION=Openlayers is a javascript library for interactive maps in the browser, similar Leaflet, Mapblibre or Mapbox GL JS. Why not try to expose your data as WMS in Geoserver and display it here? Use HostExternal and PortExternal, because this jsfiddle is hosted outside of the sandbox."
      - "CARD_5_HREF=Open,${OSGS_JSFIDDLE_URL}"
      - "CARD_6_TITLE=Data Hub"
      - "CARD_6_DESCRIPTION=File browser to upload and download files from and to the shared sandbox directory ${OSGS_SANDBOX_SHARED_MOUNT_FOLDER_NAME}. This directory is accessible from JupyterLab, pgAdmin, and GeoServer."
      - "CARD_6_HREF=Open,http://localhost:${OSGS_LOCALHOST_FILEBROWSER_PORT}/files/"
